
<style>
  @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: transparent; }

  .app {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 2rem 1.5rem;
    color: var(--color-text-primary);
  }

  .header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.4px;
    color: var(--color-text-primary);
  }

  .header p {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-top: 4px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    align-items: start;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-secondary);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .field input[type="text"],
  .field input[type="number"] {
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--color-text-primary);
    outline: none;
    transition: border-color 0.15s;
  }

  .field input:focus {
    border-color: var(--color-border-primary);
  }

  .color-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .color-swatch {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    padding: 8px 10px;
    cursor: pointer;
  }

  .color-swatch input[type="color"] {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    padding: 0;
    background: none;
    cursor: pointer;
    outline: none;
  }

  .color-swatch span {
    font-size: 12px;
    color: var(--color-text-secondary);
  }

  .slider-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-row input[type="range"] {
    flex: 1;
  }

  .slider-val {
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-secondary);
    min-width: 28px;
    text-align: right;
  }

  .toggle-group {
    display: flex;
    gap: 6px;
  }

  .toggle-btn {
    flex: 1;
    padding: 7px;
    font-size: 12px;
    font-family: inherit;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .toggle-btn.active {
    background: var(--color-background-primary);
    border-color: var(--color-border-primary);
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .gen-btn {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    background: var(--color-text-primary);
    color: var(--color-background-primary);
    border: none;
    border-radius: var(--border-radius-md);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: -0.2px;
  }

  .gen-btn:hover { opacity: 0.85; }
  .gen-btn:active { transform: scale(0.98); }

  .preview-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    position: sticky;
    top: 1rem;
  }

  #qr-canvas {
    border-radius: 50%;
    display: block;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }

  .download-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    color: var(--color-text-primary);
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }

  .download-btn:hover {
    background: var(--color-background-primary);
    border-color: var(--color-border-primary);
  }

  .section-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    padding-bottom: 2px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }

  @media (max-width: 560px) {
    .layout { grid-template-columns: 1fr; }
    .preview-panel { position: static; }
  }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Apple-aesthetic circular QR code generator with orbiting dots</h2>

<div class="app">
  <div class="header">
    <h1>Circular QR Generator</h1>
    <p>Minimalist Apple aesthetic with orbiting dots</p>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="section-title">Content</div>

      <div class="field">
        <label>URL or Text</label>
        <input type="text" id="url-input" value="https://forms.gle/UUDbRHLBSQp5McmZA" placeholder="https://...">
      </div>

      <div class="section-title" style="margin-top:4px">Colors</div>

      <div class="color-row">
        <div class="field">
          <label>Dots color</label>
          <div class="color-swatch">
            <input type="color" id="dot-color" value="#1d1d1f">
            <span id="dot-hex">#1d1d1f</span>
          </div>
        </div>
        <div class="field">
          <label>Background</label>
          <div class="color-swatch">
            <input type="color" id="bg-color" value="#f5f5f7">
            <span id="bg-hex">#f5f5f7</span>
          </div>
        </div>
      </div>

      <div class="color-row">
        <div class="field">
          <label>Ring color</label>
          <div class="color-swatch">
            <input type="color" id="ring-color" value="#d2d2d7">
            <span id="ring-hex">#d2d2d7</span>
          </div>
        </div>
        <div class="field">
          <label>Orbit color</label>
          <div class="color-swatch">
            <input type="color" id="orbit-dot-color" value="#1d1d1f">
            <span id="orbit-hex">#1d1d1f</span>
          </div>
        </div>
      </div>

      <div class="section-title" style="margin-top:4px">Orbit dots</div>

      <div class="slider-field">
        <label class="field" style="font-size:12px;font-weight:500;color:var(--color-text-secondary);letter-spacing:0.3px;text-transform:uppercase;">Count</label>
        <div class="slider-row">
          <input type="range" id="dot-count" min="3" max="24" value="12" step="1">
          <span class="slider-val" id="dot-count-val">12</span>
        </div>
      </div>

      <div class="slider-field">
        <label class="field" style="font-size:12px;font-weight:500;color:var(--color-text-secondary);letter-spacing:0.3px;text-transform:uppercase;">Dot size</label>
        <div class="slider-row">
          <input type="range" id="dot-size" min="2" max="14" value="6" step="1">
          <span class="slider-val" id="dot-size-val">6</span>
        </div>
      </div>

      <div class="slider-field">
        <label class="field" style="font-size:12px;font-weight:500;color:var(--color-text-secondary);letter-spacing:0.3px;text-transform:uppercase;">Orbit gap</label>
        <div class="slider-row">
          <input type="range" id="orbit-gap" min="4" max="40" value="18" step="1">
          <span class="slider-val" id="orbit-gap-val">18</span>
        </div>
      </div>

      <div class="section-title" style="margin-top:4px">Style</div>

      <div class="field">
        <label>Dot shape</label>
        <div class="toggle-group">
          <button class="toggle-btn active" id="shape-circle" onclick="setShape('circle')">Circle</button>
          <button class="toggle-btn" id="shape-square" onclick="setShape('square')">Square</button>
          <button class="toggle-btn" id="shape-diamond" onclick="setShape('diamond')">Diamond</button>
        </div>
      </div>

      <div class="field">
        <label>Fade effect</label>
        <div class="toggle-group">
          <button class="toggle-btn active" id="fade-on" onclick="setFade(true)">On</button>
          <button class="toggle-btn" id="fade-off" onclick="setFade(false)">Off</button>
        </div>
      </div>

      <button class="gen-btn" onclick="generate()">Generate QR code</button>
    </div>

    <div class="preview-panel">
      <canvas id="qr-canvas" width="280" height="280"></canvas>
      <a class="download-btn" id="dl-btn" download="circular_qr.png" href="#">
        <i class="ti ti-download" aria-hidden="true" style="font-size:15px"></i>
        Download PNG
      </a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let dotShape = 'circle';
let fadeEnabled = true;

function hex(id) { return document.getElementById(id).value; }

function setShape(s) {
  dotShape = s;
  ['circle','square','diamond'].forEach(n => {
    document.getElementById('shape-'+n).classList.toggle('active', n===s);
  });
  generate();
}

function setFade(v) {
  fadeEnabled = v;
  document.getElementById('fade-on').classList.toggle('active', v);
  document.getElementById('fade-off').classList.toggle('active', !v);
  generate();
}

function syncSlider(id, outId) {
  const el = document.getElementById(id);
  const out = document.getElementById(outId);
  out.textContent = el.value;
  el.addEventListener('input', () => { out.textContent = el.value; generate(); });
}

function syncColor(id, hexId) {
  const el = document.getElementById(id);
  const out = document.getElementById(hexId);
  el.addEventListener('input', () => { out.textContent = el.value; generate(); });
}

syncSlider('dot-count','dot-count-val');
syncSlider('dot-size','dot-size-val');
syncSlider('orbit-gap','orbit-gap-val');
syncColor('dot-color','dot-hex');
syncColor('bg-color','bg-hex');
syncColor('ring-color','ring-hex');
syncColor('orbit-dot-color','orbit-hex');

document.getElementById('url-input').addEventListener('change', generate);

function hexToRgba(h, a) {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function generate() {
  const url = document.getElementById('url-input').value.trim() || 'https://example.com';
  const dotColor = hex('dot-color');
  const bgColor = hex('bg-color');
  const ringColor = hex('ring-color');
  const orbitColor = hex('orbit-dot-color');
  const dotCount = parseInt(document.getElementById('dot-count').value);
  const dotSize = parseInt(document.getElementById('dot-size').value);
  const orbitGap = parseInt(document.getElementById('orbit-gap').value);

  const tempDiv = document.createElement('div');
  tempDiv.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:240px;height:240px;';
  document.body.appendChild(tempDiv);

  try {
    new QRCode(tempDiv, {
      text: url,
      width: 240,
      height: 240,
      colorDark: dotColor,
      colorLight: bgColor,
      correctLevel: QRCode.CorrectLevel.H
    });
  } catch(e) {}

  setTimeout(() => {
    const qrImg = tempDiv.querySelector('img') || tempDiv.querySelector('canvas');
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d');
    const W = 280, H = 280;
    canvas.width = W; canvas.height = H;

    const cx = W/2, cy = H/2;
    const qrSize = 200;
    const radius = W/2 - 2;
    const ringW = 5;
    const orbitRadius = qrSize/2 + orbitGap;

    ctx.clearRect(0,0,W,H);

    // Background circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.fillStyle = bgColor;
    ctx.fill();
    ctx.restore();

    // Outer ring
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.strokeStyle = ringColor;
    ctx.lineWidth = ringW;
    ctx.stroke();
    ctx.restore();

    // Draw QR inside circular clip
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, qrSize/2, 0, Math.PI*2);
    ctx.clip();

    const loadAndDraw = (src) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        ctx.drawImage(img, cx - qrSize/2, cy - qrSize/2, qrSize, qrSize);
        ctx.restore();

        // Orbit dots
        for (let i = 0; i < dotCount; i++) {
          const angle = (i / dotCount) * Math.PI * 2 - Math.PI/2;
          const dx = cx + orbitRadius * Math.cos(angle);
          const dy = cy + orbitRadius * Math.sin(angle);

          let alpha = 1;
          if (fadeEnabled) {
            // fade bottom dots slightly
            const norm = (Math.sin(angle + Math.PI/2) + 1) / 2;
            alpha = 0.25 + 0.75 * norm;
          }

          ctx.save();
          ctx.fillStyle = hexToRgba(orbitColor, alpha);

          if (dotShape === 'circle') {
            ctx.beginPath();
            ctx.arc(dx, dy, dotSize/2, 0, Math.PI*2);
            ctx.fill();
          } else if (dotShape === 'square') {
            const s = dotSize;
            ctx.fillRect(dx - s/2, dy - s/2, s, s);
          } else if (dotShape === 'diamond') {
            const s = dotSize * 0.7;
            ctx.save();
            ctx.translate(dx, dy);
            ctx.rotate(Math.PI/4);
            ctx.fillRect(-s/2, -s/2, s, s);
            ctx.restore();
          }

          ctx.restore();
        }

        // Center subtle logo placeholder dot
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, 14, 0, Math.PI*2);
        ctx.fillStyle = bgColor;
        ctx.fill();
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Apple-style center mark
        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI*2);
        ctx.fillStyle = dotColor;
        ctx.fill();
        ctx.restore();

        // Update download link
        document.getElementById('dl-btn').href = canvas.toDataURL('image/png');
        document.body.removeChild(tempDiv);
      };
      img.onerror = () => {
        ctx.restore();
        document.body.removeChild(tempDiv);
      };
      img.src = src;
    };

    if (qrImg) {
      const src = qrImg.src || (qrImg.toDataURL ? qrImg.toDataURL() : '');
      loadAndDraw(src);
    } else {
      ctx.restore();
      document.body.removeChild(tempDiv);
    }
  }, 120);
}

generate();
</script>
